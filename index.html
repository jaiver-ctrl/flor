<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rosa Neón y Reproductor Estilo Spotify</title>
  <style>
    /* Estilos Generales */
    body {
      margin: 0;
      padding: 0;
      display: flex; /* Divide la pantalla */
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
    }

    /* Mitad Izquierda: Rosa 3D */
    #left-panel {
      flex: 1; /* Toma el 50% de la pantalla */
      position: relative;
    }

    /* Mitad Derecha: Reproductor y Letras */
    #right-panel {
      flex: 1; /* Toma el otro 50% de la pantalla */
      display: flex;
      background-color: #121212;
    }

    /* Columna Letras (dentro del panel derecho) */
    .lyrics-container {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      scroll-behavior: smooth;
      background: linear-gradient(180deg, #2a2a2a 0%, #121212 100%);
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding-bottom: 50vh;
    }

    .lyrics-container::-webkit-scrollbar {
      display: none;
    }

    .lyric-line {
      font-size: 26px; /* Letra un poco más pequeña para que encaje bien en la mitad */
      font-weight: bold;
      color: #a7a7a7;
      cursor: pointer;
      transition: color 0.3s ease, transform 0.3s ease;
      margin: 0;
    }

    .lyric-line:hover {
      color: #ffffff;
    }

    .lyric-line.active {
      color: #1db954;
      transform: scale(1.05);
      text-shadow: 0 0 10px rgba(29, 185, 84, 0.5);
    }

    /* Columna Reproductor (dentro del panel derecho) */
    .player-container {
      flex: 1;
      background-color: #181818;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border-left: 1px solid #282828;
    }

    .album-cover {
      width: 200px;
      height: 200px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-bottom: 20px;
      object-fit: cover;
    }

    .song-info {
      text-align: center;
      margin-bottom: 20px;
    }

    .song-title {
      font-size: 22px;
      margin: 0 0 5px 0;
      font-weight: bold;
    }

    .artist-name {
      font-size: 14px;
      color: #b3b3b3;
      margin: 0;
    }

    .progress-wrapper {
      width: 90%;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 12px;
      color: #a7a7a7;
    }

    .progress-bar {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      background: #535353;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #1db954;
      cursor: pointer;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .btn {
      background: none;
      border: none;
      color: #b3b3b3;
      font-size: 20px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .btn:hover {
      color: #ffffff;
    }

    .btn-play {
      background-color: #1db954;
      color: #000;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, background-color 0.2s;
    }

    .btn-play:hover {
      background-color: #1ed760;
      transform: scale(1.05);
      color: #000;
    }

  /* --- ADAPTACIÓN PARA CELULARES --- */
    @media (max-width: 768px) {
      body {
        flex-direction: column; 
      }
      
      #left-panel {
        flex: none;
        height: 40vh; /* La rosa ocupa el 40% de arriba */
        width: 100vw;
      }
      
      #right-panel {
        flex: none;
        height: 60vh; /* Letras y reproductor ocupan el 60% de abajo */
        flex-direction: column;
        width: 100vw;
      }
      
      .lyrics-container {
        flex: 1; /* Toma TODO el espacio que sobre */
        padding: 15px;
        padding-bottom: 20px; 
      }
      
      .lyric-line {
        font-size: 18px; /* Reducimos la letra para leer cómodo en vertical */
      }
      
      .player-container {
        flex: none; /* ¡El truco! Evita que el reproductor crezca de más */
        border-left: none;
        border-top: 1px solid #282828; 
        padding: 10px 15px 25px 15px; /* Margen extra abajo por los gestos del cel */
      }
      
      .album-cover {
        width: 70px; /* Portada mucho más compacta */
        height: 70px;
        margin-bottom: 10px;
      }
      
      .song-title {
        font-size: 18px;
      }
      
      .progress-wrapper {
        margin-bottom: 15px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="left-panel"></div>

  <div id="right-panel">
    <div class="lyrics-container" id="lyrics-box">
      </div>

    <div class="player-container">
      <img src="portada.jpeg" alt="Portada" class="album-cover">
      <div class="song-info">
        <h2 class="song-title">Khe</h2>
        <p class="artist-name">Rauw Alejandro & Romeo Santos</p>
      </div>

      <div class="progress-wrapper">
        <span id="current-time">0:00</span>
        <input type="range" class="progress-bar" id="progress-bar" value="0" step="1">
        <span id="duration">0:00</span>
      </div>

      <div class="controls">
        <button class="btn">⏮</button>
        <button class="btn btn-play" id="play-btn">▶</button>
        <button class="btn">⏭</button>
      </div>

      <audio id="audio-player" src="cancion.mp3"></audio>
    </div>
  </div>

  <script>
    const lyricsData = [
      { time: 1, text: "Quédate" },
      { time: 3, text: "¿Pa' dónde tú va'? Ven, ¿pa' dónde tú va'?" },
      { time: 6, text: "quédate" },
      { time: 9, text: "¿Pa' dónde tú va'?" },
      { time: 11, text: "Me dices que: ¿Pa' qué?, y yo te digo que" },
      { time: 14, text: "¿Pa' qué nos mentimos? Si, en el fondo, se" },
      { time: 17, text: "Te nota tanto que te está matando" },
      { time: 21, text: "Decir que, ahora, mejor sin mí la estás pasando" },
      { time: 24, text: "Me dices que: ¿Pa' qué?" },
      { time: 27, text: "Y yo te digo que, y yo te digo que: ¿Pa' qué?" },
      { time: 30, text: "Me dices que: ¿Pa' qué?" },
      { time: 33, text: "Y tú, sin mí, no sé si bien la estás pasando" },
      { time: 36, text: "Mami" },
      { time: 38, text: "Es Rauw Alejandro junto a The King Romeo, jaja (the biggest)" },
      { time: 42, text: "Y, yo no sé lo que tú y yo tenemo', pero quiero que sepas que es especial" },
      { time: 48, text: "Te escribí lo que sentía y lo borré" },
      { time: 51, text: "Te dije que no te amaba y lo arruiné" },
      { time: 54, text: "Sabiendo que" },
      { time: 56, text: "(Cuando te ibas, solo quería besarte)" },
      { time: 59, text: "como me quedo?? ajajjaj"}
      // Pega el resto de tus tiempos y letras aquí mano, ya sabes cómo es
    ];

    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const progressBar = document.getElementById('progress-bar');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const lyricsBox = document.getElementById('lyrics-box');

    lyricsData.forEach((line, index) => {
      const p = document.createElement('p');
      p.className = 'lyric-line';
      p.id = `lyric-${index}`;
      p.innerText = line.text;
      
      p.addEventListener('click', () => {
        audio.currentTime = line.time;
        if (audio.paused) togglePlay();
      });

      lyricsBox.appendChild(p);
    });

    let isPlaying = false;
    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        playBtn.innerText = '▶';
      } else {
        audio.play();
        playBtn.innerText = '⏸';
      }
      isPlaying = !isPlaying;
    }

    playBtn.addEventListener('click', togglePlay);

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    audio.addEventListener('loadedmetadata', () => {
      progressBar.max = audio.duration;
      durationEl.innerText = formatTime(audio.duration);
    });

    let currentActiveIndex = -1;
    audio.addEventListener('timeupdate', () => {
      const time = audio.currentTime;
      progressBar.value = time;
      currentTimeEl.innerText = formatTime(time);

      let newActiveIndex = -1;
      for (let i = 0; i < lyricsData.length; i++) {
        if (time >= lyricsData[i].time) {
          newActiveIndex = i;
        } else {
          break; 
        }
      }

      if (newActiveIndex !== currentActiveIndex && newActiveIndex !== -1) {
        document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active'));
        const activeLyric = document.getElementById(`lyric-${newActiveIndex}`);
        activeLyric.classList.add('active');
        activeLyric.scrollIntoView({ behavior: 'smooth', block: 'center' });
        currentActiveIndex = newActiveIndex;
      }
    });

    progressBar.addEventListener('input', () => {
      audio.currentTime = progressBar.value;
    });
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // Ahora la escena se crea dentro del panel izquierdo, no en toda la pantalla
    const container = document.getElementById('left-panel');
    const width = container.clientWidth;
    const height = container.clientHeight;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.04);

    const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
    camera.position.set(0, 1.0, 18); 

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ReinhardToneMapping;
    container.appendChild(renderer.domElement);

    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(width, height), 1.5, 0.5, 0.1);
    bloomPass.strength = 2.4; 
    bloomPass.radius = 0.6;
    bloomPass.threshold = 0.05;

    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    const masterGroup = new THREE.Group();
    scene.add(masterGroup);

    const roseGroup = new THREE.Group();
    
    const petalMaterial = new THREE.LineBasicMaterial({
      color: 0xffccdf, 
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending
    });

    for (let layer = 0; layer < 22; layer++) {
      const points = [];
      const radius = 0.2 + Math.pow(layer * 0.12, 1.1);
      const petals = 5; 
      
      for (let t = 0; t <= Math.PI * 2.01; t += 0.02) {
        const shape = Math.pow(Math.abs(Math.sin((petals / 2) * t)), 0.5);
        const r = radius * shape;
        const x = r * Math.cos(t + layer * 0.05);
        const z = r * Math.sin(t + layer * 0.05);
        const y = Math.pow(r, 1.3) * 1.5 - (layer * 0.05); 
        points.push(new THREE.Vector3(x, y, z));
      }
      
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.Line(geometry, petalMaterial);
      line.rotation.y = layer * (Math.PI / 1.618);
      roseGroup.add(line);
    }

    const coreGeo = new THREE.SphereGeometry(0.1, 16, 16);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const core = new THREE.Mesh(coreGeo, coreMat);
    roseGroup.add(core);

    const stemHeight = 3.5; 
    const stemGeo = new THREE.CylinderGeometry(0.15, 0.30, stemHeight, 16);
    const stemMat = new THREE.MeshBasicMaterial({ color: 0x88ff88, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending });
    const stem = new THREE.Mesh(stemGeo, stemMat);
    stem.position.y = -stemHeight / 2 + 0.1; 
    roseGroup.add(stem);

    const thornGeo = new THREE.ConeGeometry(0.08, 0.25, 4); 
    const thornMat = new THREE.MeshBasicMaterial({ color: 0x88ff88, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });

    for (let i = 0; i < 9; i++) { 
        const thornContainer = new THREE.Group();
        thornContainer.position.y = -0.3 - (i * 0.35); 
        thornContainer.rotation.y = i * (Math.PI * 0.75); 
        const thorn = new THREE.Mesh(thornGeo, thornMat);
        thorn.position.x = 0.25; 
        thorn.rotation.z = -Math.PI / 3; 
        thornContainer.add(thorn);
        roseGroup.add(thornContainer);
    }

    roseGroup.position.y = 1;
    masterGroup.add(roseGroup);

    const ringGeo = new THREE.TorusGeometry(2.5, 0.02, 16, 100);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2.2;
    ring.position.y = 1;
    masterGroup.add(ring);

    const butterflyCount = 15; 
    const butterflies = [];
    
    const wingShape = new THREE.Shape();
    wingShape.moveTo(0, 0);
    wingShape.quadraticCurveTo(0.2, 0.3, 0.4, 0.1);
    wingShape.quadraticCurveTo(0.3, -0.1, 0, 0);
    const wingGeo = new THREE.ShapeGeometry(wingShape);
    wingGeo.scale(1.5, 1.5, 1.5); 

    const butterflyMat = new THREE.MeshBasicMaterial({ 
        color: 0xff1053, side: THREE.DoubleSide, transparent: true, opacity: 1.0, blending: THREE.AdditiveBlending
    });

    for (let i = 0; i < butterflyCount; i++) {
      const bContainer = new THREE.Group();
      const leftWing = new THREE.Mesh(wingGeo, butterflyMat);
      const rightWing = new THREE.Mesh(wingGeo, butterflyMat);
      rightWing.rotation.x = Math.PI; 
      bContainer.add(leftWing);
      bContainer.add(rightWing);
      
      butterflies.push({ 
          mesh: bContainer, 
          leftWing: leftWing, 
          rightWing: rightWing,
          speedX: 0.1 + Math.random() * 0.2,
          speedY: 0.1 + Math.random() * 0.2,
          speedZ: 0.1 + Math.random() * 0.2,
          offsetX: Math.random() * Math.PI * 2,
          offsetY: Math.random() * Math.PI * 2,
          offsetZ: Math.random() * Math.PI * 2,
          radiusX: 5 + Math.random() * 10,
          radiusY: 4 + Math.random() * 8,
          radiusZ: 5 + Math.random() * 10,
      });
      scene.add(bContainer); 
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      masterGroup.rotation.y = time * 0.2;
      roseGroup.rotation.y = time * -0.1;

      butterflies.forEach((b) => {
        const currentX = Math.sin(time * b.speedX + b.offsetX) * b.radiusX;
        const currentY = Math.cos(time * b.speedY + b.offsetY) * b.radiusY + 2;
        const currentZ = Math.sin(time * b.speedZ + b.offsetZ) * b.radiusZ;

        b.mesh.position.set(currentX, currentY, currentZ);

        const nextX = Math.sin((time + 0.1) * b.speedX + b.offsetX) * b.radiusX;
        const nextY = Math.cos((time + 0.1) * b.speedY + b.offsetY) * b.radiusY + 2;
        const nextZ = Math.sin((time + 0.1) * b.speedZ + b.offsetZ) * b.radiusZ;
        
        b.mesh.lookAt(nextX, nextY, nextZ);

        const flap = Math.abs(Math.sin(time * 15 + b.offsetX)) * 1.2;
        b.leftWing.rotation.y = flap;
        b.rightWing.rotation.y = -flap;
      });

      composer.render();
    }
    animate();

    // Actualiza el tamaño si la ventana cambia de resolución
    window.addEventListener('resize', () => {
      const newWidth = container.clientWidth;
      const newHeight = container.clientHeight;
      camera.aspect = newWidth / newHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(newWidth, newHeight);
      composer.setSize(newWidth, newHeight);
    });

  </script>
</body>
</html>
